<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SmartStock — Entrar</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div class="login-wrap">
  <form class="card login-card" id="form-login" novalidate>
    <div class="marca"><div class="caixa"></div><div><b>SmartStock</b><span>GESTÃO DE ALMOXARIFADO</span></div></div>
    <h1>Bem-vindo ao SmartStock!</h1>
    <p class="sub">Insira suas credenciais para prosseguir.</p>

    <div class="erro-form" id="erro" role="alert" style="margin-top:16px;margin-bottom:0"></div>

    <div class="campo">
      <label class="lab" for="email" style="font-size:12px">Usuário</label>
      <div class="com-icone">
        <svg class="i" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="8" r="4"/><path d="M4 21c1-5 15-5 16 0"/></svg>
        <input id="email" type="email" placeholder="seu e-mail" autocomplete="username" required>
      </div>
    </div>
    <div class="campo">
      <label class="lab" for="senha" style="font-size:12px">Senha</label>
      <div class="com-icone">
        <svg class="i" viewBox="0 0 24 24" aria-hidden="true"><rect x="5" y="11" width="14" height="10" rx="2"/><path d="M8 11V8a4 4 0 018 0v3"/></svg>
        <input id="senha" type="password" placeholder="••••••••" autocomplete="current-password" required>
        <button type="button" id="ver-senha" aria-label="Mostrar senha">
          <svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M2 12s4-7 10-7 10 7 10 7-4 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></svg>
        </button>
      </div>
    </div>
    <button type="submit" class="btn btn-dark" id="btn-entrar">Entrar</button>
  </form>
</div>
<script src="js/login.js"></script>
</body>
</html>
