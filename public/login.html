<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>SmartStock — Entrar</title>
<link rel="stylesheet" href="css/style.css" />
<style>
  body {
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background:
      radial-gradient(circle at 15% 20%, rgba(31,58,61,0.06), transparent 40%),
      repeating-linear-gradient(135deg, rgba(31,58,61,0.035) 0 2px, transparent 2px 34px),
      var(--paper);
  }
  .login-shell { width: 100%; max-width: 380px; padding: 20px; }
  .wordmark {
    display: flex; align-items: center; gap: 10px;
    margin-bottom: 28px;
  }
  .wordmark .crate {
    width: 34px; height: 34px;
    background: var(--structural);
    border-radius: var(--radius);
    position: relative;
    flex-shrink: 0;
  }
  .wordmark .crate::before, .wordmark .crate::after {
    content: '';
    position: absolute;
    background: var(--amber);
  }
  .wordmark .crate::before { top: 7px; left: 0; right: 0; height: 2px; }
  .wordmark .crate::after { left: 7px; top: 0; bottom: 0; width: 2px; }
  .wordmark h1 { font-size: 22px; letter-spacing: -0.02em; }
  .wordmark .sub { font-size: 11.5px; font-family: var(--font-mono); color: var(--ink-soft); }

  .login-card { padding: 26px 24px 24px; }
  .login-card h2 { font-size: 16px; margin-bottom: 3px; }
  .login-card .hint { font-size: 12.5px; color: var(--ink-soft); margin-bottom: 20px; }

  .login-footer {
    margin-top: 18px;
    font-family: var(--font-mono);
    font-size: 11px;
    color: var(--ink-soft);
    text-align: center;
  }
  .demo-box {
    margin-top: 16px;
    border: 1px dashed var(--line);
    border-radius: var(--radius);
    padding: 10px 12px;
    font-family: var(--font-mono);
    font-size: 11.5px;
    color: var(--ink-soft);
    background: var(--paper);
  }
  .demo-box b { color: var(--ink); }
</style>
</head>
<body>
  <div class="login-shell">
    <div class="wordmark">
      <div class="crate"></div>
      <div>
        <h1>SmartStock</h1>
        <div class="sub">GESTÃO DE ALMOXARIFADO</div>
      </div>
    </div>

    <form class="tag-card login-card" id="login-form">
      <h2>Acessar o sistema</h2>
      <div class="hint">Informe seu login e senha corporativos.</div>

      <div class="form-error" id="login-error"></div>

      <div class="field">
        <label for="email">E-mail</label>
        <input type="email" id="email" name="email" placeholder="voce@empresa.com" required autocomplete="username" />
      </div>
      <div class="field">
        <label for="senha">Senha</label>
        <input type="password" id="senha" name="senha" placeholder="••••••••" required autocomplete="current-password" />
      </div>

      <button type="submit" class="btn btn-primary" style="width:100%;" id="login-btn">Entrar</button>

      <div class="demo-box">
        Primeiro acesso? Rode <b>npm run seed</b> no servidor para criar o gerente padrão:<br/>
        <b>gerente@smartstock.com</b> / <b>admin123</b>
      </div>
    </form>

    <div class="login-footer">SmartStock — controle de entradas e saídas de itens</div>
  </div>

  <div id="toast-region"></div>
  <script src="js/login.js"></script>
</body>
</html>
